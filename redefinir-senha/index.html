<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Redefinir senha — Foco ENEM</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(145deg, #edf8ff, #c8e8ff 52%, #eaf5ff); color: #073647;
      font: 17px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 560px); padding: 36px 34px; border: 1px solid #ffffffb8;
      border-radius: 22px; background: #fffffff2; box-shadow: 0 18px 55px #0a4d7830; }
    .brand { color: #1672d4; font-size: 15px; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 8px 0 10px; color: #0b3550; font-size: clamp(28px, 7vw, 40px); line-height: 1.15; }
    p { color: #405968; } label { display: block; margin: 16px 0 6px; font-weight: 700; }
    .field { display: flex; gap: 8px; } input { width: 100%; padding: 12px; border: 1px solid #9ab5c7;
      border-radius: 10px; font: inherit; } button { padding: 12px 16px; border: 0; border-radius: 10px;
      background: #1672d4; color: white; font: inherit; font-weight: 750; cursor: pointer; }
    button.secondary { flex: 0 0 auto; background: #e8f3ff; color: #174f78; }
    #status { min-height: 28px; margin-top: 16px; font-weight: 650; }
    .error { color: #a32121; } .success { color: #176b3a; }
  </style>
</head>
<body>
  <main>
    <div class="brand">FOCO ENEM</div>
    <h1>Crie uma nova senha</h1>
    <p>Informe uma senha com pelo menos 8 caracteres. O link recebido por e-mail só pode ser usado para esta recuperação.</p>
    <form id="form">
      <label for="password">Nova senha</label>
      <div class="field">
        <input id="password" type="password" minlength="8" autocomplete="new-password" required>
        <button id="toggle" class="secondary" type="button">Mostrar</button>
      </div>
      <label for="confirm">Confirme a nova senha</label>
      <input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
      <button type="submit" style="margin-top:20px">Salvar nova senha</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const SUPABASE_URL = 'https://pjsybmytogowjkmvfihh.supabase.co';
    const PUBLISHABLE_KEY = 'sb_publishable_vLr0KulyjuuSdtfYXydwTw_pXd8C3_u';
    const params = new URLSearchParams(location.hash.slice(1));
    const token = params.get('access_token') || '';
    const form = document.querySelector('#form');
    const password = document.querySelector('#password');
    const confirm = document.querySelector('#confirm');
    const status = document.querySelector('#status');
    document.querySelector('#toggle').addEventListener('click', (event) => {
      const visible = password.type === 'text';
      password.type = confirm.type = visible ? 'password' : 'text';
      event.currentTarget.textContent = visible ? 'Mostrar' : 'Ocultar';
    });
    if (!token) {
      form.hidden = true;
      status.className = 'error';
      status.textContent = 'Este link é inválido ou expirou. Solicite um novo link no aplicativo.';
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (password.value !== confirm.value) {
        status.className = 'error'; status.textContent = 'As duas senhas precisam ser iguais.'; return;
      }
      status.className = ''; status.textContent = 'Salvando…';
      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', apikey: PUBLISHABLE_KEY, Authorization: `Bearer ${token}` },
          body: JSON.stringify({ password: password.value })
        });
        if (!response.ok) throw new Error('rejected');
        form.hidden = true; status.className = 'success';
        status.textContent = 'Senha alterada! Volte ao Foco ENEM e entre com a nova senha.';
        history.replaceState({}, document.title, location.pathname);
      } catch (_) {
        status.className = 'error';
        status.textContent = 'Não foi possível alterar a senha. O link pode ter expirado; solicite outro no aplicativo.';
      }
    });
  </script>
</body>
</html>
