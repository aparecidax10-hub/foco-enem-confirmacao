<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>E-mail confirmado — Foco ENEM</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(145deg, #edf8ff 0%, #c8e8ff 52%, #eaf5ff 100%);
      color: #073647;
      font: 17px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: 38px 34px;
      border: 1px solid #ffffffb8;
      border-radius: 22px;
      background: #fffffff2;
      box-shadow: 0 18px 55px #0a4d7830;
      text-align: center;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #1672d4;
      color: white;
      font-size: 42px;
      font-weight: 800;
      line-height: 1;
    }
    .brand {
      color: #1672d4;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .14em;
    }
    h1 {
      margin: 8px 0 10px;
      color: #0b3550;
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.15;
    }
    p { margin: 0; color: #405968; }
    .hint {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #e8f3ff;
      color: #174f78;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <div class="brand">FOCO ENEM</div>
    <h1>E-mail confirmado!</h1>
    <p>Sua conta foi confirmada com sucesso e já está pronta para ser usada.</p>
    <p class="hint">Agora você pode fechar esta página, voltar ao aplicativo e entrar na sua conta.</p>
  </main>
</body>
</html>
